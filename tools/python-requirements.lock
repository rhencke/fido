# The complete third-party Python dependency set of this repository.
#
# It is EMPTY, and that emptiness is a claim rather than an accident: `tools/host-python-gate.py` collects
# every module every project `.py` imports and rejects any that is neither in the standard library of the
# pinned runtime below nor listed here.  Adding `import requests` to a tool fails the gate until the package
# is entered here with an exact version and hash, so an unpinned dependency cannot arrive unnoticed.
#
# Because the set is empty, the pinned image installs no Python package at all.  "No installation during an
# ordinary gate run" is therefore a property of the image rather than a policy anyone has to keep.
#
# runtime: python 3.12.13
# image:   python:3.12-slim-bookworm@sha256:d50fb7611f86d04a3b0471b46d7557818d88983fc3136726336b2a4c657aa30b
#
# Entry format, if a dependency is ever added:
#   <name>==<version> --hash=sha256:<64 hex digits>
#
# (no entries)
